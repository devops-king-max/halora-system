name: Halora checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: halora_test
          POSTGRES_PASSWORD: ci_isolated_database_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U halora_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ['1025:1025', '8025:8025']
    env:
      TEST_DATABASE_URL: postgresql://halora_test:ci_isolated_database_only@127.0.0.1:5432/postgres
      MAILPIT_TEST_URL: http://127.0.0.1:8025
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      HALORA_BROWSER_TEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm build && pnpm typecheck && pnpm lint
      - run: pnpm --filter @halora/api exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm db:verify-schema
      - run: pnpm --filter @halora/mobile exec expo export --platform android --output-dir ../../.local/mobile-export
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-integration-screenshot
          path: .local/admin-integration.png
          include-hidden-files: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: pnpm db:bootstrap:docker
      - run: pnpm --filter @halora/api exec tsx scripts/verify-docker.ts
      - run: pnpm --filter @halora/api exec playwright install --with-deps chromium
      - run: pnpm --filter @halora/api exec tsx scripts/verify-web.ts
      - run: pnpm db:backup:docker
      - run: pnpm db:restore-check:docker "$(find "$PWD/.local/backups" -name '*.dump' -print -quit)"
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
