name: halora

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 3000
  DB_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-halora}
  POSTGRES_USER: ${POSTGRES_USER:-halora_app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  QUOTE_SECRET: ${QUOTE_SECRET:?Set QUOTE_SECRET in .env}
  SHIPPING_FEE: ${SHIPPING_FEE:-30000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
  PUBLIC_BASE_URL: ${DEMO_PUBLIC_BASE_URL:-http://localhost:8080}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: "true"
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  MAIL_FROM: ${MAIL_FROM:-Halora <no-reply@halora.local>}
  STAFF_RESET_URL: ${DEMO_STAFF_RESET_URL:-http://localhost:8080/reset-password}
  CUSTOMER_RESET_URL: ${CUSTOMER_RESET_URL:-halora://reset-password}
  UPLOAD_DIR: /app/.local/uploads

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-halora}
      POSTGRES_USER: ${POSTGRES_USER:-halora_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [halora]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks: [halora]

  migrate:
    image: halora-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    command: [node, apps/api/dist/scripts/migrate.js]
    environment: *api-environment
    networks: [halora]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    image: halora-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - uploads:/app/.local/uploads
    networks: [halora]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks: [halora]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget --spider --quiet http://127.0.0.1:8080/ && wget --spider --quiet http://127.0.0.1:8080/api/v1/ready']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  seed-demo:
    image: postgres:18
    profiles: [tools]
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-halora}
      PGUSER: ${POSTGRES_USER:-halora_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./database/seed-demo.sql:/seed/seed-demo.sql:ro
    networks: [halora]
    depends_on:
      db: {condition: service_healthy}
    entrypoint: [psql]
    command: [--no-psqlrc, --set, ON_ERROR_STOP=1, --file, /seed/seed-demo.sql]

volumes:
  postgres_data:
  uploads:

networks:
  halora:
    driver: bridge
