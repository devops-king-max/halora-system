openapi: 3.0.3
info:
  title: Halora Cosmetics API
  description: Official OpenAPI 3.0.3 integration contract for Halora cosmetics administration and customer shopping system.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development backend server
paths:
  # ================= AUTHENTICATION =================
  /auth/staff/login:
    post:
      tags: [Auth]
      summary: Staff login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Username or email
                password:
                  minLength: 1
                  maxLength: 128
                  type: string
      responses:
        '200':
          description: Staff login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAuthResultResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/customer/login:
    post:
      tags: [Auth]
      summary: Customer login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Username or email
                password:
                  minLength: 1
                  maxLength: 128
                  type: string
      responses:
        '200':
          description: Customer login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAuthResultResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/customer/register:
    post:
      tags: [Auth]
      summary: Customer registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, username, email, phone, password]
              properties:
                fullName:
                  type: string
                username:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  minLength: 10
                  maxLength: 128
                  type: string
      responses:
        '201':
          description: Customer registered successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [customerId, accountId]
                    properties:
                      customerId:
                        $ref: '#/components/schemas/UUID'
                      accountId:
                        $ref: '#/components/schemas/UUID'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /auth/staff/refresh:
    post:
      tags: [Auth]
      summary: Refresh staff access token using HttpOnly cookie
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAuthResultResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/customer/refresh:
    post:
      tags: [Auth]
      summary: Refresh customer access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAuthResultResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/staff/logout:
    post:
      tags: [Auth]
      summary: Staff logout
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Staff logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/customer/logout:
    post:
      tags: [Auth]
      summary: Customer logout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Customer logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated principal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/profile:
    get:
      tags: [Auth]
      summary: Get own personal profile for staff or customer, including administrators
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Own personal profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfileResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Auth]
      summary: Update own full name, email and phone without staff management permissions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfileUpdateInput'
      responses:
        '200':
          description: Updated personal profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfileResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password for current account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  minLength: 10
                  maxLength: 128
                  type: string
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /auth/staff/forgot-password:
    post:
      tags: [Auth]
      summary: Request staff password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset instructions sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/customer/forgot-password:
    post:
      tags: [Auth]
      summary: Request customer password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset instructions sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/staff/reset-password:
    post:
      tags: [Auth]
      summary: Reset staff password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  minLength: 10
                  maxLength: 128
                  type: string
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /auth/customer/reset-password:
    post:
      tags: [Auth]
      summary: Reset customer password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  minLength: 10
                  maxLength: 128
                  type: string
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  # ================= PUBLIC STOREFRONT =================
  /categories:
    get:
      tags: [Storefront]
      summary: List active product categories
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, code, createdAt]
        - $ref: '#/components/parameters/SortOrderQuery'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPaginatedResponse'

  /brands:
    get:
      tags: [Storefront]
      summary: List active brands
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, code, createdAt]
        - $ref: '#/components/parameters/SortOrderQuery'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPaginatedResponse'

  /products:
    get:
      tags: [Storefront]
      summary: List public products
      parameters:
        - name: categoryId
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: brandId
          in: query
          schema:
            $ref: '#/components/schemas/UUID'
        - name: minPrice
          in: query
          schema:
            $ref: '#/components/schemas/Money'
        - name: maxPrice
          in: query
          schema:
            $ref: '#/components/schemas/Money'
        - name: isFeatured
          in: query
          schema:
            type: boolean
        - name: inStock
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, priceFrom, createdAt]
        - $ref: '#/components/parameters/SortOrderQuery'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductSummaryPaginatedResponse'

  /products/{id}:
    get:
      tags: [Storefront]
      summary: Get public product details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProductDetailResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  # ================= CUSTOMER PORTAL (/me) =================
  /me/profile:
    get:
      tags: [Customer]
      summary: Get customer profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Customer]
      summary: Update customer profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, version]
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                version:
                  type: integer
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /me/addresses:
    get:
      tags: [Customer]
      summary: List customer delivery addresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressListResponse'
    post:
      tags: [Customer]
      summary: Create new delivery address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressInput'
      responses:
        '201':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressResponse'

  /me/addresses/{id}:
    patch:
      tags: [Customer]
      summary: Update delivery address
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerAddressUpdateInput'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAddressResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Customer]
      summary: Delete delivery address
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: Address deleted

  /me/cart:
    get:
      tags: [Cart]
      summary: Get active customer shopping cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'

  /me/cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, quantity]
              properties:
                variantId:
                  $ref: '#/components/schemas/UUID'
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
    delete:
      tags: [Cart]
      summary: Clear entire cart
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cart cleared

  /me/cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, version]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                version:
                  type: integer
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Cart]
      summary: Remove item from cart
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: version
          in: query
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cart item removed

  /me/checkout/quote:
    post:
      tags: [Checkout]
      summary: Generate checkout pricing quote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutQuoteInput'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutQuoteResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /me/orders:
    post:
      tags: [Orders]
      summary: Place order with checkout quote
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
      responses:
        '201':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
    get:
      tags: [Orders]
      summary: List customer orders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: from
          in: query
          schema:
            $ref: '#/components/schemas/ISODateTime'
        - name: to
          in: query
          schema:
            $ref: '#/components/schemas/ISODateTime'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryPaginatedResponse'

  /me/orders/{id}:
    get:
      tags: [Orders]
      summary: Get customer order detail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Orders]
      summary: Update pending order (while PENDING_CONFIRMATION)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePendingOrderInput'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /me/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel customer order (while PENDING_CONFIRMATION)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancelInput'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  # ================= ADMIN RESOURCES =================
  /admin/categories:
    get:
      tags: [Admin Categories]
      summary: Admin list product categories
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActiveStatus'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, code, createdAt, updatedAt]
        - $ref: '#/components/parameters/SortOrderQuery'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPaginatedResponse'
    post:
      tags: [Admin Categories]
      summary: Admin create product category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'

  /admin/categories/{id}:
    get:
      tags: [Admin Categories]
      summary: Admin get category by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
    patch:
      tags: [Admin Categories]
      summary: Admin update category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CategoryInput'
                - type: object
                  required: [version]
                  properties:
                    version:
                      type: integer
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Admin Categories]
      summary: Admin delete category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: Category deleted
        '409':
          description: Resource in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /admin/brands:
    get:
      tags: [Admin Brands]
      summary: Admin list brands
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActiveStatus'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, code, createdAt, updatedAt]
        - $ref: '#/components/parameters/SortOrderQuery'
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPaginatedResponse'
    post:
      tags: [Admin Brands]
      summary: Admin create brand
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandInput'
      responses:
        '201':
          description: Operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'

  /admin/brands/{id}/thumbnail:
    put:
      tags: [Admin Brands]
      summary: Set the brands representative image
      description: Requires brands.update. Upload a PNG/JPEG/WebP image using POST /admin/media, then pass its ID. The version belongs to the target record.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThumbnailInput'
      responses:
        '200':
          description: Record with the selected representative image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'

  /admin/brands/{id}:
    get:
      tags: [Admin Brands]
      summary: Admin get brand by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
