components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  parameters:
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    SearchQuery:
      name: search
      in: query
      schema:
        type: string
    SortOrderQuery:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
        description: Unique key preventing duplicated mutations
    ReportCommonQueryParams:
      name: reportFilter
      in: query
      schema:
        type: object
        properties:
          from:
            $ref: '#/components/schemas/ISODateTime'
          to:
            $ref: '#/components/schemas/ISODateTime'
          compareFrom:
            $ref: '#/components/schemas/ISODateTime'
          compareTo:
            $ref: '#/components/schemas/ISODateTime'
          productId:
            $ref: '#/components/schemas/UUID'
          variantId:
            $ref: '#/components/schemas/UUID'
          categoryId:
            $ref: '#/components/schemas/UUID'
          employeeId:
            $ref: '#/components/schemas/UUID'
          supplierId:
            $ref: '#/components/schemas/UUID'
          orderStatus:
            $ref: '#/components/schemas/OrderStatus'
          paymentStatus:
            $ref: '#/components/schemas/PaymentStatus'
          page:
            type: integer
            default: 1
          limit:
            type: integer
            default: 20

  responses:
    ErrorResponse:
      description: API error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    # Basic primitives
    UUID:
      type: string
      format: uuid
    Money:
      maxLength: 18
      type: string
      pattern: '^[0-9]+$'
      description: Integer string in VND currency (e.g. 250000)
    Percentage:
      type: string
      pattern: '^[0-9]+(\.[0-9]{1,2})?$'
      description: Decimal string percentage (e.g. 10.00)
    ISODateTime:
      type: string
      format: date-time

    # Enumerations
    ActiveStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    AccountRealm:
      type: string
      enum: [CUSTOMER, STAFF]
    AccountStatus:
      type: string
      enum: [ACTIVE, LOCKED, INACTIVE]
    OrderStatus:
      type: string
      enum: [PENDING_CONFIRMATION, CONFIRMED, SHIPPING, COMPLETED, CANCELLED]
    PaymentMethod:
      type: string
      enum: [COD, BANK_TRANSFER]
    PaymentStatus:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED, CANCELLED]
    RefundStatus:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED]
    DocumentStatus:
      type: string
      enum: [DRAFT, POSTED, CANCELLED]
    PromotionType:
      type: string
      enum: [PRODUCT, ORDER, VOUCHER]

    PromotionStatus:
      type: string
      enum: [DRAFT, ACTIVE, PAUSED, ENDED]
    StockMovementType:
      type: string
      enum: [RECEIPT, SALE, CANCELLATION, ADJUSTMENT]
    DiscountScope:
      type: string
      enum: [PRODUCT, ORDER, VOUCHER]
    ReportMetricUnit:
      type: string
      enum: [VND, COUNT, QUANTITY]
    ReportColumnType:
      type: string
      enum: [TEXT, MONEY, NUMBER, DATETIME, STATUS]
    ReportSourceType:
      type: string
      enum: [ORDER, INVOICE, GOODS_RECEIPT]

    # Common Envelopes
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        requestId:
          type: string

    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'

    MessageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string

    ActionInput:
      type: object
      required: [version]
      properties:
        version:
          type: integer
        note:
          type: string
          nullable: true

    EntityMetadata:
      type: object
      required: [id, createdAt, updatedAt, version]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        createdAt:
          $ref: '#/components/schemas/ISODateTime'
        updatedAt:
          $ref: '#/components/schemas/ISODateTime'
        version:
          type: integer

    # Auth
    Principal:
      description: Account roles determine the fixed permission set; accountId is an internal UUID and accountCode is the visible code.
      type: object
      required: [accountId, accountCode, realm, username, email, displayName, customerId, employeeId, roles, permissions]
      properties:
        accountId:
          $ref: '#/components/schemas/UUID'
        accountCode:
          type: string
          pattern: '^TK[0-9]{2,}$'
        realm:
          $ref: '#/components/schemas/AccountRealm'
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        customerId:
          type: string
          format: uuid
          nullable: true
        employeeId:
          type: string
          format: uuid
          nullable: true
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string

    AccountProfileUpdateInput:
      type: object
      additionalProperties: false
      required: [fullName, email, phone, version]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
        version:
          type: integer
          minimum: 1

    AccountProfile:
      type: object
      required: [accountId, realm, username, fullName, email, phone, version]
      properties:
        accountId:
          $ref: '#/components/schemas/UUID'
        realm:
          $ref: '#/components/schemas/AccountRealm'
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        version:
          type: integer
          minimum: 1

    AccountProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AccountProfile'

    PrincipalResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Principal'

    StaffAuthResult:
      type: object
      required: [accessToken, expiresIn, principal]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
        principal:
          $ref: '#/components/schemas/Principal'

    StaffAuthResultResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StaffAuthResult'

    CustomerAuthResult:
      allOf:
        - $ref: '#/components/schemas/StaffAuthResult'
        - type: object
          required: [refreshToken]
          properties:
            refreshToken:
              type: string

    CustomerAuthResultResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CustomerAuthResult'

    # Category
    Category:
      allOf:
        - $ref: '#/components/schemas/EntityMetadata'
        - type: object
          required: [code, name, description, status]
          properties:
            code:
              type: string
            name:
              type: string
            description:
              type: string
              nullable: true
            status:
              $ref: '#/components/schemas/ActiveStatus'

    CategoryInput:
      type: object
      required: [name, description, status]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ActiveStatus'

    CategoryResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Category'

    CategoryPaginatedResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # Brand
    Brand:
      allOf:
        - $ref: '#/components/schemas/EntityMetadata'
        - type: object
          required: [code, name, description, status, thumbnailMediaId, thumbnailUrl]
          properties:
            thumbnailMediaId:
              type: string
              format: uuid
              nullable: true
            thumbnailUrl:
              type: string
              nullable: true
            code:
              type: string
            name:
              type: string
            description:
              type: string
              nullable: true
            status:
              $ref: '#/components/schemas/ActiveStatus'

    BrandInput:
      type: object
      required: [name, description, status]
      properties:
        thumbnailMediaId:
          type: string
          format: uuid
          nullable: true
          description: ID of an uploaded image; omit to preserve the current selection, null to clear it.
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ActiveStatus'

    BrandResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Brand'

    BrandPaginatedResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # Product
    Product:
      allOf:
        - $ref: '#/components/schemas/EntityMetadata'
        - type: object
          required: [code, name, slug, categoryId, brandId, description, ingredients, benefits, isFeatured, status, thumbnailMediaId, thumbnailUrl]
          properties:
            thumbnailMediaId:
              type: string
              format: uuid
              nullable: true
            thumbnailUrl:
              type: string
              nullable: true
            code:
              type: string
            name:
              type: string
            slug:
              type: string
            categoryId:
              $ref: '#/components/schemas/UUID'
            brandId:
              $ref: '#/components/schemas/UUID'
            description:
              type: string
              nullable: true
            ingredients:
              type: string
              nullable: true
            benefits:
              type: string
              nullable: true
            isFeatured:
              type: boolean
            status:
              $ref: '#/components/schemas/ActiveStatus'

    ProductInput:
      type: object
      required: [name, slug, categoryId, brandId, description, ingredients, benefits, isFeatured, status]
      properties:
        thumbnailMediaId:
          type: string
          format: uuid
          nullable: true
          description: ID of an uploaded image; omit to preserve the current selection, null to clear it.
        name:
